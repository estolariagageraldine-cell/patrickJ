<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatitos Jane</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="context"></div>

    <div class="area">
        <ul class="circles">
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ul>

        <div class="titulo">
            <p class="t">Fondos de pantalla de gatitos</p>
        </div>

        <div class="imagenes">
            <img src="images/images.jpg" alt="gato1" data-image="images.jpg">
            <img src="images/images (1).jpg" alt="gato2" data-image="images (1).jpg">
            <img src="images/images (2).jpg" alt="gato3" data-image="images (2).jpg">
        </div>
    </div>

    <div id="emailModal" class="modal hidden" aria-modal="true" role="dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Enviar imagen</h2>
                <button id="closeModal" class="close-btn" type="button" aria-label="Cerrar">×</button>
            </div>

            <div class="modal-preview">
                <img id="modalImage" src="" alt="imagen seleccionada">
            </div>

            <form id="emailForm" class="modal-form">
                <label for="emailInput">Correo electrónico</label>
                <input id="emailInput" type="email" placeholder="tuemail@gmail.com" required>

                <div class="modal-actions">
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Enviar</button>
                </div>

                <div id="modalMessage" class="modal-message" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
